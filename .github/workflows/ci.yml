name: CI

on:
  pull_request:
    branches: [main]
  # Manual dispatch (#41): PRs opened by the scheduled-refresh workflow's
  # GITHUB_TOKEN don't trigger pull_request events (GitHub's anti-recursion
  # rule), so that workflow explicitly runs this on its branch to populate
  # the required "check" status for the same commit.
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
